name: "🧩 New club or feature"
description: "Ask for support of a new device / Demander la prise en charge d'un nouvel appareil"
title: "[Device]: "
labels: ["new device"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or French. / Vous pouvez écrire en anglais ou en français.
        
        ⚠️ Do not paste your Ten'Up cookie, password or personal licence number. / Ne collez jamais votre cookie Ten'Up, votre mot de passe ni votre numéro de licence.
  - type: input
    id: model
    attributes:
      label: "Brand and model / Marque et modèle"
      placeholder: "Club name, padel courts..."
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: "Home Assistant integration / Intégration Home Assistant"
      description: "The integration that provides the entities / L'intégration qui fournit les entités"
    validations:
      required: false
  - type: textarea
    id: entities
    attributes:
      label: "Entities and states / Entités et états"
      description: "Developer tools > States: entity_id, state and attributes. One per entity. / Outils de développement > États : entity_id, état et attributs. Une par entité."
      render: yaml
    validations:
      required: false
  - type: textarea
    id: behaviour
    attributes:
      label: "What should it show or do? / Que doit-il afficher ou faire ?"
      description: "Missing sensors, controls, values... / Capteurs, commandes, valeurs manquants..."
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: "Photo or screenshot / Photo ou capture"
      description: "Screenshot of the official app, for example. / Capture de l'application officielle, par exemple."
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: "Diagnostics / Diagnostics"
      description: "Drag the diagnostics file here. / Glissez le fichier de diagnostics ici."
    validations:
      required: false
